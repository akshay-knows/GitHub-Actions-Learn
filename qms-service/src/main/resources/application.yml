server:
  port: 8081
spring:
  application:
    name: qms-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:qmsservice;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: swiftyquote-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  boot:
    admin:
      client:
        url: http://localhost:9090
        instance:
          service-base-url: http://localhost:8081
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,threaddump,httpexchanges,mappings
  endpoint:
    health:
      show-details: always
logging:
  level:
    com.swiftyquote: INFO
    org.springframework.web: WARN
